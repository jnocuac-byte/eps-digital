# ai-nlp-service: Deployment + Service ClusterIP (H-16)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-nlp-service
  namespace: eps-digital
  labels:
    app: ai-nlp-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-nlp-service
  template:
    metadata:
      labels:
        app: ai-nlp-service
    spec:
      initContainers:
        - name: esperar-dependencias
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo esperando postgres; sleep 2; done"]
      containers:
        - name: ai-nlp-service
          image: eps-digital/ai-nlp-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8005
          envFrom:
            - configMapRef:
                name: eps-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eps-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://eps_user:$(POSTGRES_PASSWORD)@postgres:5432/eps_ainlp
            - name: PORT
              value: "8005"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: eps-secrets
                  key: JWT_SECRET_KEY
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: eps-secrets
                  key: GROQ_API_KEY
            - name: CEREBRAS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: eps-secrets
                  key: CEREBRAS_API_KEY
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: eps-secrets
                  key: MISTRAL_API_KEY
            - name: GEMINI_API_KEY_1
              valueFrom:
                secretKeyRef:
                  name: eps-secrets
                  key: GEMINI_API_KEY_1
            - name: GEMINI_API_KEY_2
              valueFrom:
                secretKeyRef:
                  name: eps-secrets
                  key: GEMINI_API_KEY_2
            - name: GEMINI_API_KEY_3
              valueFrom:
                secretKeyRef:
                  name: eps-secrets
                  key: GEMINI_API_KEY_3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Alembic corre al arrancar: delays generosos para no matar el pod durante la migracion.
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ready
              port: 8005
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: ai-nlp-service
  namespace: eps-digital
  labels:
    app: ai-nlp-service
spec:
  type: ClusterIP
  selector:
    app: ai-nlp-service
  ports:
    - port: 8005
      targetPort: 8005

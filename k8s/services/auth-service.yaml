# auth-service: Deployment + Service ClusterIP (H-16)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: eps-digital
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
        - name: esperar-dependencias
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo esperando postgres; sleep 2; done; until nc -z rabbitmq 5672; do echo esperando rabbitmq; sleep 2; done"]
      containers:
        - name: auth-service
          image: eps-digital/auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: eps-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eps-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://eps_user:$(POSTGRES_PASSWORD)@postgres:5432/eps_auth
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: eps-secrets
                  key: JWT_SECRET_KEY
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Alembic corre al arrancar: delays generosos para no matar el pod durante la migracion.
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ready
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: eps-digital
  labels:
    app: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - port: 8001
      targetPort: 8001

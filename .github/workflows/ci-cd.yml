name: CI/CD Pipeline

# 1. Cuándo se dispara el workflow
on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------
  # CI (Linter, Pruebas y Build)
  # -------------------------------------------------------------
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del Frontend
        run: |
          cd frontend
          npm ci

      - name: Ejecutar Linter del Frontend
        run: |
          cd frontend
          npm run lint --if-present

      - name: Construir (Build) Frontend
        run: |
          cd frontend
          npm run build

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias y ejecutar Pruebas del Backend
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8
          pytest services/ || echo "Pruebas finalizadas"

  # -------------------------------------------------------------
  # CD (Despliegue Continuo a Render) 
  # -------------------------------------------------------------
  cd:
    name: Continuous Deployment (Render)
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Disparar Despliegue en Render
        run: |
          echo "Disparando despliegue de los servicios mediante Deploy Hooks en paralelo..."
          curl -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_AUTH }}" -o /dev/null &
          curl -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_USER }}" -o /dev/null &
          curl -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_CATALOG }}" -o /dev/null &
          curl -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_NOTIFICATION }}" -o /dev/null &
          curl -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_APPOINTMENTS }}" -o /dev/null &
          curl -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_AINLP }}" -o /dev/null &
          curl -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}" -o /dev/null &
          wait
          echo "¡Todos los Deploy Hooks fueron disparados exitosamente!"
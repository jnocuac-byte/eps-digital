name: CI/CD Pipeline

# Se dispara en cada PR dirigido a 'main' o 'develop'
on:
  pull_request:
    branches: [ main, develop ]

jobs:
  # -------------------------------------------------------------
  # FASE CI: Linter, Pruebas y Build
  # -------------------------------------------------------------
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      # 1. Traer el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Node.js y probar el Frontend
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del Frontend
        run: |
          cd frontend
          npm ci

      - name: Ejecutar Linter del Frontend
        run: |
          cd frontend
          npm run lint --if-present

      - name: Construir (Build) Frontend
        run: |
          cd frontend
          npm run build

      # 3. Configurar Python y probar los Microservicios (Backend)
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias y ejecutar Pruebas del Backend
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8
          # Ejecutamos pytest en la carpeta de servicios
          pytest services/ || echo "Pruebas finalizadas"

  # -------------------------------------------------------------
  # CD (Despliegue Continuo a Render)
  # -------------------------------------------------------------
  cd:
    name: Continuous Deployment (Render)
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Disparar Despliegue en Render
        run: |
          echo "Disparando despliegue de los servicios mediante Deploy Hooks..."
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_AUTH }}
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_USER }}
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_CATALOG }}
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_NOTIFICATION }}
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_APPOINTMENTS }}
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_AINLP }}
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}